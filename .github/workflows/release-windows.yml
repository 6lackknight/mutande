# Unsigned Windows alpha installer (SmartScreen will warn). Authenticode deferred.
# Trigger: Actions → Release Windows alpha → Run workflow
name: Release Windows alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "win-alpha-*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build mutande-core
        working-directory: core
        run: cargo build --release

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Read app version
        id: ver
        working-directory: app
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1
          $v = ($line -replace '^version:\s*', '').Trim()
          $semver = ($v -split '\+')[0]
          "version=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "full=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Flutter Windows
        working-directory: app
        env:
          # Forward slashes — CMake mis-parses Windows backslash escapes in ENV.
          MUTANDE_CORE_EXE: ${{ github.workspace }}/core/target/release/mutande-core.exe
        run: |
          flutter build windows --release `
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Bundle sidecar into Release
        run: |
          $release = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) {
            $release = Get-ChildItem -Path app/build/windows -Recurse -Directory -Filter Release |
              Where-Object { Test-Path (Join-Path $_.FullName "mutande.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $release) { throw "Flutter Release output not found" }
          Copy-Item -Force "core/target/release/mutande-core.exe" (Join-Path $release "mutande-core.exe")
          "RELEASE_DIR=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $release | Format-Table Name, Length

      - name: Build Inno Setup installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found (Inno Setup install failed)" }
          # Forward slashes — Inno preprocessor treats \ as escapes in #define values.
          $release = ((Resolve-Path $env:RELEASE_DIR).Path) -replace '\\', '/'
          $outDir = ($pwd.Path) -replace '\\', '/'
          & $iscc `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DReleaseDir=$release" `
            "/O$outDir" `
            /Fmutande-alpha-windows-setup `
            "app\windows\installer\mutande.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          Get-Item (Join-Path $outDir "mutande-alpha-windows-setup.exe") | Format-List FullName, Length

      - name: Zip portable alpha
        run: |
          $zip = Join-Path $pwd "mutande-alpha-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $env:RELEASE_DIR "*") -DestinationPath $zip
          Get-Item $zip | Format-List FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutande-alpha-windows
          path: |
            mutande-alpha-windows-setup.exe
            mutande-alpha-windows.zip
          if-no-files-found: error
          retention-days: 14

  # Same bucket + script as local Mac DMG uploads (mutande-releases / downloads.mutande.online).
  publish-r2:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: mutande-alpha-windows
          path: dist/windows

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            pip install --quiet awscli
          fi
          aws --version

      - name: Upload to R2 (mutande-releases)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_DOWNLOADS_ACCESS_KEY_ID: ${{ secrets.R2_DOWNLOADS_ACCESS_KEY_ID }}
          R2_DOWNLOADS_SECRET_ACCESS_KEY: ${{ secrets.R2_DOWNLOADS_SECRET_ACCESS_KEY }}
          R2_DOWNLOADS_BUCKET: mutande-releases
          R2_DOWNLOADS_PUBLIC_BASE: https://downloads.mutande.online
        run: |
          set -euo pipefail
          test -n "${R2_ACCOUNT_ID:-}"
          test -n "${R2_DOWNLOADS_ACCESS_KEY_ID:-}"
          test -n "${R2_DOWNLOADS_SECRET_ACCESS_KEY:-}"
          setup="$(find dist/windows -name 'mutande-alpha-windows-setup.exe' -type f | head -n1)"
          zip="$(find dist/windows -name 'mutande-alpha-windows.zip' -type f | head -n1)"
          test -n "$setup"
          test -n "$zip"
          chmod +x scripts/upload-downloads-r2.sh
          ./scripts/upload-downloads-r2.sh "$setup" "$zip"
